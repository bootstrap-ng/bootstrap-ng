---
name: 'Check spelling'
on:
  pull_request:
    # ready_for_review is needed so the check runs when a draft pull request is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    runs-on: ubuntu-slim
    # Skip drafts and Dependabot pull requests. (branches-ignore on pull_request filters the
    # base branch, not the head branch, so it never matched Dependabot's branches.)
    if: github.event.pull_request.draft != true && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          check_dot_files: false
          incremental_files_only: true
          inline: warning
          strict: false

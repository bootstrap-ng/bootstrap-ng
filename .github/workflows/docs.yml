name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build docs
        run: npx ng build docs --base-href "${BASE_PATH}/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Add canonical and last-modified tags
        run: npm run page-meta -- --base-url "${BASE_URL}"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Build search index
        run: npm run search-index
      - name: Generate llms.txt
        run: npm run llms-txt -- --base-url "${BASE_URL}"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Generate llms-full.txt
        run: npm run llms-full-txt -- --base-url "${BASE_URL}"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Generate sitemap.xml
        run: npm run sitemap -- --base-url "${BASE_URL}"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      # GitHub Pages serves 404.html for paths that aren't prerendered, so they load the SPA.
      - run: cp dist/docs/browser/index.csr.html dist/docs/browser/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

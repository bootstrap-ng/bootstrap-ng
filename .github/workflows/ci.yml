name: CI

# Skip CI when a change only touches files that can't affect the build or tests.
# Prettier ignores Markdown (.prettierignore), and Super-Linter and cspell still check these files.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**/LICENSE'
      - .cspell.json
      - .github/CODEOWNERS
      - .vscode/**
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/LICENSE'
      - .cspell.json
      - .github/CODEOWNERS
      - .vscode/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
          retention-days: 14

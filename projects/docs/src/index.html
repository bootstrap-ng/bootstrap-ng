    <!-- Keep the version in step with "bootstrap" in package.json. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=optional: swapping Geist in after first paint shifts the layout. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=optional"
      rel="stylesheet" />
    <!-- Set the color mode before the pre-rendered page paints; Bootstrap's [data-bs-theme] rules set the matching color-scheme. Matches DocsThemeToggle. -->
    <!-- prettier-ignore -->
    <script>(()=>{let m;try{m=localStorage.getItem('docs-color-mode')}catch{}if(m!=='light'&&m!=='dark')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-bs-theme',m)})()</script>

  </body>

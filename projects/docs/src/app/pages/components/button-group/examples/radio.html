<div class="d-flex flex-column align-items-start gap-3">
  <div bsButtonGroup aria-label="Basic radio toggle button group">
    <label class="btn-check btn-outline theme-primary">
      <input type="radio" name="btnradio" checked />
      Radio 1
    </label>
    <label class="btn-check btn-outline theme-primary">
      <input type="radio" name="btnradio" />
      Radio 2
    </label>
    <label class="btn-check btn-outline theme-primary">
      <input type="radio" name="btnradio" />
      Radio 3
    </label>
  </div>
  <div bsButtonGroup aria-label="Radio toggle button group with a disabled option">
    <label class="btn-check btn-solid theme-secondary">
      <input type="radio" name="btnradio-disabled" checked />
      Radio 1
    </label>
    <label class="btn-check btn-solid theme-secondary">
      <input type="radio" name="btnradio-disabled" disabled />
      Radio 2
    </label>
    <label class="btn-check btn-solid theme-secondary">
      <input type="radio" name="btnradio-disabled" />
      Radio 3
    </label>
  </div>
</div>

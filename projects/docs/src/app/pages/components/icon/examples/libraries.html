<dl class="mb-0">
  <dt>Bootstrap Icons</dt>
  <dd class="hstack gap-4 fs-2xl">
    <bs-icon name="heart" />
    <bs-icon name="heart-fill" />
    <bs-icon name="cloud-arrow-up" />
    <bs-icon name="github" />
  </dd>
  <dt>Modus Icons</dt>
  <dd class="hstack gap-4 fs-2xl">
    <bs-icon library="modus" name="heart" />
    <bs-icon library="modus" variant="outlined" name="heart" />
    <bs-icon library="modus" name="cloud-upload" />
    <bs-icon library="modus" name="settings" />
  </dd>
  <dt>Font Awesome</dt>
  <dd class="hstack gap-4 fs-2xl">
    <bs-icon library="font-awesome" name="heart" />
    <bs-icon library="font-awesome" variant="regular" name="heart" />
    <bs-icon library="font-awesome" name="cloud-arrow-up" />
    <bs-icon library="font-awesome" variant="brands" name="github" />
  </dd>
  <dt>Material Symbols</dt>
  <dd class="hstack gap-4 fs-2xl mb-0">
    <bs-icon library="material" name="favorite" />
    <bs-icon library="material" name="favorite-fill" />
    <bs-icon library="material" variant="rounded" name="cloud_upload" />
    <bs-icon library="material" variant="sharp" name="settings" />
  </dd>
</dl>

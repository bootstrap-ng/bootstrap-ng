<div class="d-flex flex-wrap gap-2">
  @for (variant of variants; track variant) {
    <button type="button" bsButton theme="primary" (click)="dialog.show()">
      Open .{{ variant }}
    </button>

    <dialog
      bsDialog
      #dialog="bsDialog"
      [class]="variant"
      [attr.aria-labelledby]="`fullscreen-dialog-title-${$index}`">
      <div class="dialog-header">
        <h2 class="dialog-title" [id]="`fullscreen-dialog-title-${$index}`">.{{ variant }}</h2>
        <button bsCloseButton bsDialogClose></button>
      </div>
      <div class="dialog-body">
        <p>
          This dialog uses <code>.{{ variant }}</code
          >.
        </p>
      </div>
      <div class="dialog-footer">
        <button type="button" bsButton theme="secondary" bsDialogClose>Close</button>
      </div>
    </dialog>
  }
</div>

<div bsFormField class="mb-3">
  <input type="checkbox" bsCheck [checked]="open()" (change)="open.set(!open())" />
  <label bsLabel>Show advanced options</label>
</div>
<div bsCollapse [(open)]="open" (shown)="log('shown')" (hidden)="log('hidden')">
  <div class="card card-body">Advanced options go here.</div>
</div>
<p class="mt-3 mb-0 fs-sm fg-3">Events: {{ events().join(', ') || 'none' }}</p>

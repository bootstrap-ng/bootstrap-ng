<div class="hstack gap-2 flex-wrap">
  <button type="button" bsButton theme="primary" (click)="save()">Save</button>
  <button type="button" bsButton theme="danger" (click)="fail()">Fail</button>
  <button type="button" bsButton="outline" theme="secondary" (click)="archive()">Archive</button>
  <button type="button" bsButton="outline" theme="secondary" (click)="toaster.clear()">
    Clear all
  </button>
</div>

<ng-template #undo let-toast>
  Message archived.
  <div class="hstack gap-2 mt-2">
    <button type="button" bsButton size="sm" theme="primary" (click)="toast.hide()">Undo</button>
  </div>
</ng-template>

<div
  class="overflow-auto border rounded"
  style="height: 20rem"
  tabindex="0"
  role="region"
  aria-label="10,000 employees, scrollable">
  <table
    bsTable
    [data]="employees"
    [(columns)]="columns"
    [(sort)]="sort"
    [rowKey]="rowKey"
    virtualScroll
    stickyHeader
    striped
    class="mb-0 text-nowrap">
    <caption class="visually-hidden">
      10,000 employees, rendered as you scroll
    </caption>
  </table>
</div>

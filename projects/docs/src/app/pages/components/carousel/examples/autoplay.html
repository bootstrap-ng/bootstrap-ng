<div bsCarousel autoplay [interval]="4000" aria-label="Autoplaying carousel">
  <div class="carousel-inner">
    <div bsCarouselItem>
      <div
        class="d-flex align-items-center justify-content-center rounded-5 bg-2"
        style="height: 240px">
        First slide
      </div>
    </div>
    <div bsCarouselItem>
      <div
        class="d-flex align-items-center justify-content-center rounded-5 bg-3"
        style="height: 240px">
        Second slide
      </div>
    </div>
    <div bsCarouselItem>
      <div
        class="d-flex align-items-center justify-content-center rounded-5 bg-2"
        style="height: 240px">
        Third slide
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-2">
    <div class="carousel-indicators">
      @for (i of [0, 1, 2]; track i) {
        <button
          type="button"
          [bsCarouselIndicator]="i"
          [attr.aria-label]="`Slide ${i + 1}`"></button>
      }
    </div>
    <div>
      <button type="button" class="btn-icon btn-sm" bsCarouselPlayPause>
        <span class="carousel-icon-pause" aria-hidden="true"></span>
        <span class="carousel-icon-play" aria-hidden="true"></span>
      </button>
      <button type="button" class="btn-icon btn-sm" bsCarouselPrev>
        <span class="carousel-icon-prev" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button type="button" class="btn-icon btn-sm" bsCarouselNext>
        <span class="carousel-icon-next" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
</div>

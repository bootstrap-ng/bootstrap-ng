<div bsCarousel ends="stop" aria-label="Carousel that stops at the ends">
  <div class="carousel-inner">
    <div bsCarouselItem>
      <div
        class="d-flex align-items-center justify-content-center rounded-5 bg-2"
        style="height: 240px">
        First slide
      </div>
    </div>
    <div bsCarouselItem>
      <div
        class="d-flex align-items-center justify-content-center rounded-5 bg-3"
        style="height: 240px">
        Second slide
      </div>
    </div>
    <div bsCarouselItem>
      <div
        class="d-flex align-items-center justify-content-center rounded-5 bg-2"
        style="height: 240px">
        Third slide
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-end mt-2">
    <div>
      <button type="button" class="btn-icon btn-sm" bsCarouselPrev>
        <span class="carousel-icon-prev" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button type="button" class="btn-icon btn-sm" bsCarouselNext>
        <span class="carousel-icon-next" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
</div>

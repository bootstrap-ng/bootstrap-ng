<div bsFormField>
  <label bsFormLabel>Framework</label>
  <input
    bsFormControl
    [bsTypeahead]="search"
    [formatter]="name"
    [itemTemplate]="item"
    [editable]="false"
    [formField]="project.framework" />
  <div bsInvalidFeedback>Pick a framework from the list.</div>
</div>
<p class="mt-3 mb-0">Picked: {{ project.framework().value()?.name ?? 'none' }}</p>

<ng-template #item let-framework let-text="text">
  <span class="menu-item-content">
    <span>{{ text }}</span>
    <small class="menu-item-description">{{ framework.language }}</small>
  </span>
</ng-template>

<div bsFormField>
  <label bsFormLabel>Framework</label>
  <input
    bsFormControl
    [bsTypeahead]="search"
    [formatter]="name"
    [itemTemplate]="item"
    (itemSelect)="picked.set($event)" />
</div>
<p class="mt-3 mb-0">Picked: {{ picked()?.name ?? 'none' }}</p>

<ng-template #item let-framework let-text="text">
  <span class="menu-item-content">
    <span>{{ text }}</span>
    <small class="menu-item-description">{{ framework.language }}</small>
  </span>
</ng-template>

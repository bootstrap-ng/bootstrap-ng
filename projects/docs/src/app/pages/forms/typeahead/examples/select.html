<div bsFormField>
  <label bsFormLabel>Add a team member</label>
  <input
    #member
    bsFormControl
    [bsTypeahead]="search"
    (itemSelect)="add($event); member.value = ''" />
</div>
<ul class="list-unstyled d-flex flex-wrap gap-2 mt-3 mb-0" aria-label="Team">
  @for (person of team(); track person) {
    <li>
      <span bsBadge theme="secondary">{{ person }}</span>
    </li>
  } @empty {
    <li class="fg-3">No one yet.</li>
  }
</ul>

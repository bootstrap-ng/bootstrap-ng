<div bsFormField>
  <label bsFormLabel>Search</label>

      <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path
          d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
      </svg>
    </span>
    <input type="search" bsFormControl="ghost" placeholder="Search…" [formControl]="query" />
  </label>
  <small bsFormText>Search across all pages and posts.</small>
  <div bsInvalidFeedback>Please enter a search term.</div>
</div>

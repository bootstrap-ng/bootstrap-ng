<div class="vstack gap-3">
  <div bsFormField>
    <label bsFormLabel>Amount in dollars</label>
    <label bsFormAdorn>
      <span bsFormAdornText>$</span>
      <input bsFormControl="ghost" inputmode="decimal" placeholder="0.00" />
    </label>
  </div>
  <div bsFormField>
    <label bsFormLabel>Email username</label>
    <label bsFormAdorn end>
      <span bsFormAdornText>&#64;example.com</span>
      <input bsFormControl="ghost" placeholder="username" />
    </label>
  </div>
</div>

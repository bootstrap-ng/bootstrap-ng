<div class="d-flex flex-wrap align-items-end gap-3">
  <div>
    <label bsFormLabel for="datepickerSmall">Small</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerSmall"
      size="sm"
      autocomplete="off"
      placeholder="Choose date…" />
  </div>
  <div>
    <label bsFormLabel for="datepickerDefault">Default</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerDefault"
      autocomplete="off"
      placeholder="Choose date…" />
  </div>
  <div>
    <label bsFormLabel for="datepickerLarge">Large</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerLarge"
      size="lg"
      autocomplete="off"
      placeholder="Choose date…" />
  </div>
</div>

<div class="d-flex flex-wrap gap-3">
  <div>
    <label bsFormLabel for="datepickerSunday">Week starts on Sunday</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerSunday"
      class="w-12"
      autocomplete="off"
      firstWeekday="0"
      locale="en-US"
      placeholder="Select a date" />
  </div>
  <div>
    <label bsFormLabel for="datepickerFrench">In French</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerFrench"
      class="w-12"
      autocomplete="off"
      locale="fr-FR"
      placeholder="Choisir une date"
      calendarLabel="Choisir une date" />
  </div>
</div>

<div class="d-flex flex-wrap gap-3">
  <div data-bs-theme="dark" class="p-3 bg-body fg-body rounded">
    <label bsFormLabel for="datepickerDark">Dark mode datepicker</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerDark"
      autocomplete="off"
      placeholder="Select a date" />
  </div>
  <div class="p-3">
    <label bsFormLabel for="datepickerDarkOnly">Dark calendar only</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerDarkOnly"
      autocomplete="off"
      colorMode="dark"
      placeholder="Select a date" />
  </div>
</div>

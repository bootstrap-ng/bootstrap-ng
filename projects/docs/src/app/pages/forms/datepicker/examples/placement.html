<div class="d-flex flex-wrap gap-3">
  <div>
    <label bsFormLabel for="datepickerStart">Start aligned</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerStart"
      autocomplete="off"
      placement="bottom-start"
      placeholder="Start" />
  </div>
  <div>
    <label bsFormLabel for="datepickerCenter">Centered</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerCenter"
      autocomplete="off"
      placement="bottom"
      placeholder="Center" />
  </div>
  <div>
    <label bsFormLabel for="datepickerEnd">End aligned</label>
    <input
      type="text"
      bsFormControl
      bsDatepicker
      id="datepickerEnd"
      autocomplete="off"
      placement="bottom-end"
      placeholder="End" />
  </div>
</div>

<form>
  <fieldset disabled class="vstack gap-3">
    <legend>Disabled fieldset example</legend>
    <div bsFormField>
      <label bsFormLabel>Disabled input</label>
      <input bsFormControl placeholder="Disabled input" />
    </div>
    <div bsFormField>
      <label bsFormLabel>Disabled select menu</label>
      <select bsFormControl>
        <option>Disabled select</option>
      </select>
    </div>
    <div bsFormField>
      <input type="checkbox" bsCheck />
      <label bsLabel>Can’t check this</label>
    </div>
    <button type="submit" bsButton theme="primary" class="align-self-start">Submit</button>
  </fieldset>
</form>

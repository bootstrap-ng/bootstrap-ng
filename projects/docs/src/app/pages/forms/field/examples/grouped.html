<fieldset class="form-group">
  <legend class="form-label">Shipping method</legend>
  <div bsFormField>
    <input type="radio" bsRadio name="fieldGroupRadio" value="standard" />
    <label bsLabel>Standard</label>
  </div>
  <div bsFormField>
    <input type="radio" bsRadio name="fieldGroupRadio" value="express" />
    <label bsLabel>Express</label>
  </div>
  <small class="form-text">Choose your preferred shipping speed.</small>
</fieldset>

<fieldset class="form-group">
  <legend class="form-label">Select a plan</legend>
  <div class="vstack gap-1">
    <div bsFormField card>
      <input type="radio" bsRadio name="fieldPlan" value="basic" checked />
      <div class="form-field-content">
        <label bsLabel>Basic</label>
        <small bsFormText>$9/month — For individuals.</small>
      </div>
    </div>
    <div bsFormField card>
      <input type="radio" bsRadio name="fieldPlan" value="pro" />
      <div class="form-field-content">
        <label bsLabel>Pro</label>
        <small bsFormText>$29/month — For teams.</small>
      </div>
    </div>
  </div>
</fieldset>

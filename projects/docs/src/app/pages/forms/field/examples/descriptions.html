<div class="vstack gap-3">
  <div bsFormField>
    <input type="checkbox" bsCheck />
    <div class="form-field-content">
      <label bsLabel>Subscribe to updates</label>
      <small bsFormText>We’ll send you a weekly digest of what’s new.</small>
    </div>
  </div>
  <div bsFormField>
    <input type="radio" bsRadio name="fieldRadioDesc" />
    <div class="form-field-content">
      <label bsLabel>Standard shipping</label>
      <small bsFormText>Arrives in 5-7 business days.</small>
    </div>
  </div>
  <div bsFormField>
    <label bsFormLabel>Username</label>
    <input bsFormControl />
    <small bsFormText>Must be 3-20 characters, letters and numbers only.</small>
  </div>
</div>

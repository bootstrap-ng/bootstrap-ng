<div class="vstack gap-3">
  <div bsFormFloating>
    <label bsLabel>Disabled email</label>
    <input type="email" bsFormControl placeholder="name@example.com" disabled />
  </div>
  <div bsFormFloating>
    <label bsLabel>Plain text email</label>
    <input
      type="email"
      bsFormControl="plaintext"
      readonly
      placeholder="name@example.com"
      value="name@example.com" />
  </div>
</div>

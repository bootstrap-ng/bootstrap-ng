<form class="vstack gap-3" bsValidate>
  <div bsFormField>
    <label bsFormLabel>Email address</label>
    <input type="email" bsFormControl required autocomplete="email" />
    <div bsInvalidFeedback>Please enter a valid email address.</div>
  </div>
  <button type="submit" bsButton theme="primary" class="align-self-start">Submit</button>
</form>

<div class="vstack gap-3">
  <div bsFormField>
    <label bsFormLabel>Username</label>
    <input bsFormControl validation="invalid" value="mark" autocomplete="username" />
    <div bsInvalidFeedback>That username is taken.</div>
  </div>
  <div bsFormField>
    <label bsFormLabel>Full name</label>
    <input bsFormControl validation="valid" value="Mark Otto" autocomplete="name" />
    <div bsValidFeedback>Looks good!</div>
  </div>
</div>

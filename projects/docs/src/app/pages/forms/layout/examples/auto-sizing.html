<form class="row gy-2 gx-3 align-items-center">
  <div class="col-auto">
    <label class="visually-hidden" for="autoSizingName">Name</label>
    <input bsFormControl id="autoSizingName" placeholder="Jane Doe" />
  </div>
  <div class="col-auto">
    <label class="visually-hidden" for="autoSizingUsername">Username</label>
    <div bsInputGroup>
      <div bsInputGroupText>&#64;</div>
      <input bsFormControl id="autoSizingUsername" placeholder="Username" />
    </div>
  </div>
  <div class="col-auto">
    <div bsFormField>
      <input type="checkbox" bsCheck />
      <label bsLabel>Remember me</label>
    </div>
  </div>
  <div class="col-auto">
    <button type="submit" bsButton theme="primary">Submit</button>
  </div>
</form>

<div class="row mb-3">
  <label for="staticEmail" class="sm:col-2 col-form-label">Email</label>
  <div class="sm:col-10">
    <input bsFormControl="plaintext" id="staticEmail" readonly value="email@example.com" />
  </div>
</div>
<div class="row">
  <label for="plaintextPassword" class="sm:col-2 col-form-label">Password</label>
  <div class="sm:col-10">
    <input type="password" bsFormControl id="plaintextPassword" autocomplete="current-password" />
  </div>
</div>

<div class="vstack gap-3">
  <div bsInputGroup>
    <span bsInputGroupText>With textarea</span>
    <textarea bsFormControl aria-label="With textarea"></textarea>
  </div>
  <div bsInputGroup>
    <label bsInputGroupText for="inputGroupSelect">Options</label>
    <select bsFormControl id="inputGroupSelect">
      <option selected>Choose…</option>
      <option value="1">One</option>
      <option value="2">Two</option>
    </select>
  </div>
  <div bsInputGroup>
    <input type="file" bsFormControl id="inputGroupFile" />
    <label bsInputGroupText for="inputGroupFile">Upload</label>
  </div>
</div>

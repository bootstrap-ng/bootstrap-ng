<div bsRating aria-label="How much do you like it?" [(value)]="rating">
  <ng-template bsRatingStar let-fill>
    <svg
      width="1em"
      height="1em"
      viewBox="0 0 16 16"
      aria-hidden="true"
      [class]="fill ? 'fg-danger' : 'fg-3'"
      [attr.fill]="fill ? 'currentColor' : 'none'"
      stroke="currentColor"
      stroke-width="1.25">
      <path d="M8 14s-5.5-3.4-5.5-7.4A3 3 0 0 1 8 4.4a3 3 0 0 1 5.5 2.2C13.5 10.6 8 14 8 14z" />
    </svg>
  </ng-template>
</div>

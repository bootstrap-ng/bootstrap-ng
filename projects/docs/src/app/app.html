<a class="visually-hidden-focusable position-absolute top-0 start-0 m-3 z-fixed" [href]="skipHref()"
  >Skip to main content</a
>

<header class="navbar-translucent sticky-top border-bottom">
  <!-- From md up, three equal columns keep the search centered, like Bootstrap's docs. -->
  <div class="2xl:container d-flex md:d-grid md:grid-cols-3 align-items-center gap-2 md:gap-5 py-4">
    <div class="d-flex align-items-center gap-2 md:gap-3">
      @if (!isHome()) {
        <button
          type="button"
          bsButton="text"
          size="sm"
          icon
          class="lg:d-none"
          aria-label="Menu"
          aria-controls="docs-sidebar"
          [attr.aria-expanded]="menuOpen()"
          (click)="menuOpen.set(!menuOpen())">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
          </svg>
        </button>
      }
      <a routerLink="/" class="fs-lg fw-bold fg-body text-decoration-none text-nowrap"
        >bootstrap-ng</a
      >
      <nav class="nav flex-nowrap d-none xl:d-flex" aria-label="Main">
        <a
          class="nav-link px-3"
          routerLink="/getting-started"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          >Docs</a
        >
        <a
          class="nav-link px-3"
          routerLink="/components/accordion"
          [class.active]="isSection('components')"
          [attr.aria-current]="isSection('components') ? 'true' : null"
          >Components</a
        >
        <a
          class="nav-link px-3"
          routerLink="/forms/overview"
          [class.active]="isSection('forms')"
          [attr.aria-current]="isSection('forms') ? 'true' : null"
          >Forms</a
        >
      </nav>
    </div>
    <docs-search class="ms-auto md:ms-0 md:justify-self-center" />
    <div class="d-flex align-items-center gap-1 md:gap-2 md:justify-self-end">
      <a
        bsButton="text"
        size="sm"
        icon
        href="https://github.com/bootstrap-ng/bootstrap-ng"
        aria-label="bootstrap-ng on GitHub">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8" />
        </svg>
      </a>
      <docs-theme-toggle />
    </div>
  </div>
</header>

@if (isHome()) {
  <main id="content" class="docs-home flex-grow-1 d-grid align-content-center" data-pagefind-body>
    <router-outlet />
  </main>
} @else {
  <div class="docs-layout 2xl:container">
    <!-- Below lg the sidebar is a bottom drawer, like Bootstrap's docs (lg:drawer drawer-bottom). -->
    <aside class="docs-sidebar fs-sm">
      <dialog
        bsDrawer
        id="docs-sidebar"
        responsive="lg"
        placement="bottom"
        aria-labelledby="docs-sidebar-title"
        [(open)]="menuOpen">
        <div class="drawer-header border-bottom">
          <h2 class="drawer-title fs-lg" id="docs-sidebar-title">Browse docs</h2>
          <button type="button" bsCloseButton bsDrawerClose></button>
        </div>
        <div class="drawer-body lg:py-5">
          <!-- Spacing mirrors Bootstrap's own docs sidebar (site/src/scss/_sidebar.scss). -->
          <nav class="w-100" aria-label="Docs">
            @for (section of nav; track section.title) {
              <div class="py-2">
                <strong class="d-block fw-bold">{{ section.title }}</strong>
                <ul class="nav flex-column mt-1">
                  @for (item of section.items; track item.path) {
                    <li class="nav-item">
                      <a
                        class="nav-link justify-content-start py-1 ms-4 border-0"
                        [routerLink]="`/${item.path}`"
                        routerLinkActive="active"
                        ariaCurrentWhenActive="page"
                        [routerLinkActiveOptions]="{ exact: true }"
                        (click)="closeMenu()">
                        {{ item.title }}
                      </a>
                    </li>
                  }
                </ul>
              </div>
            }
          </nav>
        </div>
      </dialog>
    </aside>
    <!-- Bound, not static: HTMLHint cannot tell this id is in the other @if branch. -->
    <!-- eslint-disable-next-line @angular-eslint/template/prefer-static-string-properties -->
    <main [id]="'content'" class="docs-main pt-9 pb-12" data-pagefind-body>
      <router-outlet />
    </main>
    <docs-toc class="d-none xl:d-block" />
  </div>
}
